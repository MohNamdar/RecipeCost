<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه کنترل قیمت آیتم‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#EEF2ED;
  --surface:#FFFFFF;
  --surface-2:#F4F6F2;
  --border:#DDE3D9;
  --ink:#232420;
  --ink-soft:#5B6158;
  --plum:#7C2E4C;
  --plum-dark:#5C2038;
  --plum-soft:#F3E4EA;
  --mango:#D98A3D;
  --mango-soft:#FBEBD8;
  --green:#3E7856;
  --green-soft:#E4F0E8;
  --red:#B4443A;
  --red-soft:#F8E4E1;
  --radius:10px;
  --shadow:0 1px 2px rgba(35,36,32,.06), 0 4px 14px rgba(35,36,32,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.6;
  font-size:14.5px;
}
::selection{background:var(--plum-soft)}
.app{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.topbar{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;margin-bottom:20px;flex-wrap:wrap;
}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.2px}
.brand p{margin:4px 0 0;color:var(--ink-soft);font-size:13px}
.brand .tag{display:inline-block;background:var(--plum);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;margin-inline-start:8px;vertical-align:2px;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{
  font-family:inherit;cursor:pointer;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);border-radius:8px;
  padding:9px 14px;font-size:13.5px;font-weight:600;transition:.12s;
}
button:hover{border-color:var(--plum);color:var(--plum)}
button.primary{background:var(--plum);border-color:var(--plum);color:#fff}
button.primary:hover{background:var(--plum-dark);color:#fff}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
button.ghost:hover{background:var(--surface-2);color:var(--ink)}
button.danger{color:var(--red);border-color:var(--red-soft)}
button.danger:hover{background:var(--red-soft);border-color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{border-color:var(--border);color:var(--ink)}
.tabs{background:var(--surface-2);position:sticky;top:0;display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{
  padding:10px 16px;font-weight:700;font-size:13.5px;color:var(--ink-soft);
  border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;
}
.tab.active{color:var(--plum);border-color:var(--plum)}
.tab .count{background:var(--surface-2);color:var(--ink-soft);border-radius:20px;font-size:11px;padding:1px 7px;margin-inline-start:5px}
.tab.active .count{background:var(--plum-soft);color:var(--plum)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.section-title{font-size:15px;font-weight:800;margin:0 0 4px}
.section-sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px}
table{width:100%;border-collapse:collapse}
th{
  text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:700;
  padding:9px 10px;border-bottom:1.5px solid var(--border);white-space:nowrap;
}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13.5px}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums;direction:rtl;text-align:right;font-family:inherit}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.pill.warn{background:var(--mango-soft);color:#8a5720}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.neutral{background:var(--surface-2);color:var(--ink-soft)}
input[type=number],input[type=text]{
  font-family:inherit;border:1px solid var(--border);border-radius:7px;
  padding:6px 9px;font-size:13.5px;width:100%;background:#fff;color:var(--ink);
}
input[type=number]{direction:ltr;text-align:left}
input:focus{outline:2px solid var(--plum-soft);border-color:var(--plum)}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
select{
  font-family:inherit;border:1px solid var(--border);border-radius:7px;
  padding:6px 9px;font-size:13px;background:#fff;color:var(--ink);
}
select:focus{outline:2px solid var(--plum-soft);border-color:var(--plum)}
.unit-select{width:84px}
.qty-with-unit{display:flex;align-items:center;gap:6px}
.qty-with-unit input{width:100%}
.inline-name-input{font-weight:600;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px}
.inline-name-input:hover{border-color:var(--border)}
.inline-name-input:focus{border-color:var(--plum);background:#fff}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:4px 7px;border-radius:6px;color:var(--ink-soft)}
.icon-btn:hover{background:var(--red-soft);color:var(--red)}
.recipe-name-input,.recipe-container-input{font-weight:700;font-size:15px;border:1px solid var(--border);border-radius:8px;padding:7px 10px}
.recipe-name-input{flex:1;margin-inline-end:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.banner{
  display:flex;align-items:flex-start;gap:10px;background:var(--green-soft);
  border:1px solid #cfe4d6;color:#2c5d42;border-radius:var(--radius);
  padding:12px 14px;margin-bottom:16px;font-size:13px;
}
.banner.warn{background:var(--mango-soft);border-color:#f0d3a8;color:#8a5720}
.banner b{font-weight:800}
.banner ul{margin:6px 0 0;padding-inline-start:18px}
.banner .close{margin-inline-start:auto;background:none;border:none;color:inherit;font-weight:700;cursor:pointer;padding:0 4px}
.modal-bg{
  position:fixed;inset:0;background:rgba(35,36,32,.42);display:flex;
  align-items:center;justify-content:center;z-index:50;padding:16px;
}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{margin:0;font-size:16px;font-weight:800}
.modal-body{padding:18px}
.modal-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.item-row{display:grid;grid-template-columns:1fr 100px 90px 32px;gap:8px;align-items:center;margin-bottom:8px}
.item-row .ing-name{font-size:13px}
.item-row select{width:100%;font-family:inherit;border:1px solid var(--border);border-radius:7px;padding:6px 8px;font-size:13px;background:#fff}
.subtle-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:6px}
.subtle-btn:hover{background:var(--red-soft)}
.summary-box{background:var(--surface-2);border-radius:9px;padding:12px 14px;margin-top:12px;font-size:13px}
.summary-row{display:flex;justify-content:space-between;padding:3px 0}
.summary-row.total{font-weight:800;font-size:15px;color:var(--plum);border-top:1px dashed var(--border);margin-top:6px;padding-top:8px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-soft)}
.empty .big{font-size:32px;margin-bottom:8px}
.footnote{color:var(--ink-soft);font-size:12px;margin-top:10px}
.log-item{border-bottom:1px solid var(--border);padding:14px 4px}
.log-item:last-child{border-bottom:none}
.log-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.log-meta{font-size:12px;color:var(--ink-soft)}
.log-affected{margin-top:8px;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:12.5px}
.arrow{color:var(--ink-soft);margin:0 4px}
.chip-price-old{color:var(--red);text-decoration:line-through;opacity:.75}
.chip-price-new{color:var(--green);font-weight:700}
.search-box{margin-bottom:12px}
.search-box input{max-width:280px}
.category-filter{min-width:160px}
.purchase-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:720px){.purchase-grid{grid-template-columns:1fr}}
.toolbar{position:sticky;top:45px; background: white;padding-top: 5px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.badge-review{background:var(--red-soft);color:var(--red);border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:700;margin-inline-start:6px}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#cfd6cb;border-radius:8px}
</style>
</head>

ing_091","qty":20,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_044","qty":40,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_094","qty":0,"qtyRawText":"50+20","isGarnish":false,"needsReview":true},{"ingredientId":"ing_093","qty":0,"qtyRawText":"یک بیل","isGarnish":false,"needsReview":true}],"category":"لیوان شیک"},{"id":"rec_024","name":"استیک مرغ گریل","items":[{"ingredientId":"ing_095","qty":0,"qtyRawText":"کم","isGarnish":false,"needsReview":true},{"ingredientId":"ing_096","qty":200,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_097","qty":50,"qtyRawText":null,"isGarnish":false,"needsReview":false}],"category":"بشقاب گرد متوسط"},{"id":"rec_025","name":"پرشین لاو","items":[{"ingredientId":"ing_098","qty":0,"qtyRawText":null,"isGarnish":true,"needsReview":false},{"ingredientId":"ing_008","qty":200,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_099","qty":20,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_026","qty":5,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_100","qty":10,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_007","qty":10,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_001","qty":70,"qtyRawText":null,"isGarnish":false,"needsReview":false}],"category":"کاپ لته"},{"id":"rec_026","name":"شیک سنتی","items":[{"ingredientId":"ing_101","qty":0,"qtyRawText":null,"isGarnish":true,"needsReview":false},{"ingredientId":"ing_001","qty":180,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_008","qty":40,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_034","qty":50,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_026","qty":5,"qtyRawText":null,"isGarnish":false,"needsReview":false},{"ingredientId":"ing_100","qty":15,"qtyRawText":null,"is const UNIT_LABEL = { gram: 'گرم', kg: 'کیلو', count: 'عدد' };

const fa = (n) => Number(n).toLocaleString('fa-IR', {maximumFractionDigits:2});
const price = (n) => fa(Math.round(n)) + ' هزار تومان';
const uid = (p) => p + '_' + Math.random().toString(36).slice(2,9);
const nowStr = () => new Date().toLocaleString('fa-IR', {dateStyle:'medium', timeStyle:'short'});

let STATE = {
  ingredients: [],
  recipes: [],
  settings: {},
  log: [],
  loaded: false,
};

let UI = {
  tab: 'products',
  banner: null,
  expandedRecipe: null,
  editModal: null, // {type, id}
  ingredientSearch: '',
  productSearch: '',
  categoryFilter: '',
};

// ---------- SQLite-backed storage via local Flask API ----------
const DATA_KEY = 'app-data-v2';
const LOG_KEY = 'app-log-v2';

async function loadState(){
  try{
    const [dataRes, logRes] = await Promise.all([ safeGet(DATA_KEY), safeGet(LOG_KEY) ]);
    if(dataRes){
      STATE.ingredients = dataRes.ingredients || [];
      STATE.recipes = dataRes.recipes || [];
      STATE.settings = dataRes.settings || {};
    } else {
      STATE.ingredients = JSON.parse(JSON.stringify(SEED_DATA.ingredients));
      STATE.recipes = JSON.parse(JSON.stringify(SEED_DATA.recipes));
      STATE.settings = JSON.parse(JSON.stringify(SEED_DATA.settings));
      await persistData();
    }
    // migrate older records defensively
    STATE.ingredients.forEach(i=>{
      if(i.purchaseQty === undefined){ i.purchaseQty = i.unitPrice ? 1 : 0; }
      if(i.purchasePrice === undefined){ i.purchasePrice = i.unitPrice || 0; }
      i.unitPrice = (Number(i.purchaseQty)>0) ? Number(i.purchasePrice||0)/Number(i.purchaseQty) : 0;
    });
    STATE.recipes.forEach(r=>{
      if(r.category === undefined) r.category = r.container || '';
      delete r.container;
    });
    STATE.log = logRes || [];
    await persistData();
  }catch(e){
    console.error(e);
    STATE.ingredients = JSON.parse(JSON.stringify(SEED_DATA.ingredients));
    STATE.recipes = JSON.parse(JSON.stringify(SEED_DATA.recipes));
    STATE.settings = JSON.parse(JSON.stringify(SEED_DATA.settings));
    STATE.log = [];
  }
  STATE.loaded = true;
  render();
}

async function safeGet(key){
  try{
    const r = await fetch('/api/storage/'+encodeURIComponent(key));
    if(r.status===404) return null;
    if(!r.ok) throw new Error('storage get failed');
    const x = await r.json();
    return x.value ?? null;
  }catch(e){ console.error(e); return null; }
}
async function safeSet(key, val){
  try{
    const r = await fetch('/api/storage/'+encodeURIComponent(key), {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({value:val})
    });
    if(!r.ok) throw new Error('storage set failed');
  }catch(e){ console.error('storage set failed', key, e); }
}
async function persistData(){
  await safeSet(DATA_KEY, { ingredients: STATE.ingredients, recipes: STATE.recipes, settings: STATE.settings });
}
async function persistLog(){ await safeSet(LOG_KEY, STATE.log); }

// ---------- domain logic ----------
function ingredientById(id){ return STATE.ingredients.find(i=>i.id===id); }
function recipeById(id){ return STATE.recipes.find(r=>r.id===id); }

function computeRecipeCost(recipe){
  let material = 0;
  for(const it of recipe.items){
    if(it.isGarnish) continue;
    const ing = ingredientById(it.ingredientId);
    const p = ing ? ing.unitPrice : 0;
    material += (it.qty||0) * p;
  }
  const s = STATE.settings;
  const finalPrice = ((material * (1+s.wasteRate)) + s.overheadCost + s.packagingCost + s.otherCost) * (1+s.marginRate);
  return { material, finalPrice };
}

function allRecipeCosts(){
  const map = {};
  for(const r of STATE.recipes) map[r.id] = computeRecipeCost(r);
  return map;
}

function recipesUsingIngredient(ingId){
  return STATE.recipes.filter(r => r.items.some(it => it.ingredientId === ingId && !it.isGarnish));
}

function applyChangeAndLog(changeMeta, prevCosts){
  const newCosts = allRecipeCosts();
  const affected = [];
  for(const r of STATE.recipes){
    const before = prevCosts[r.id];
    const after = newCosts[r.id];
    if(before && after && Math.round(before.finalPrice) !== Math.round(after.finalPrice)){
      affected.push({
        recipeId: r.id, recipeName: r.name,
        oldPrice: Math.round(before.finalPrice), newPrice: Math.round(after.finalPrice)
      });
    }
  }
  const entry = { id: uid('log'), ts: Date.now(), tsLabel: nowStr(), ...changeMeta, affected };
  STATE.log.unshift(entry);
  persistLog();
  return affected;
}

function showBanner(affected, subject){
  if(affected.length === 0){
    UI.banner = { type:'info', text: `«${subject}» ذخیره شد؛ قیمت نهایی هیچ محصولی تغییر نکرد.` };
  } else {
    UI.banner = { type:'warn', subject, affected };
  }
}

// ---------- ingredient mutations ----------
function updateIngredientPurchase(id, purchasePrice, purchaseQty){
  const ing = ingredientById(id);
  if(!ing) return;
  purchasePrice = Number(purchasePrice)||0;
  purchaseQty = Number(purchaseQty)||0;
  const oldUnitPrice = ing.unitPrice||0;
  const oldPurchasePrice = ing.purchasePrice||0;
  const oldPurchaseQty = ing.purchaseQty||0;
  if(oldPurchasePrice===purchasePrice && oldPurchaseQty===purchaseQty) return;
  const prevCosts = allRecipeCosts();
  ing.purchasePrice = purchasePrice;
  ing.purchaseQty = purchaseQty;
  ing.unitPrice = purchaseQty>0 ? purchasePrice/purchaseQty : 0;
  persistData();
  const affected = applyChangeAndLog({
    type:'ingredient_price', targetId:ing.id, targetName:ing.name,
    field:'خرید (مبلغ / مقدار)', oldValue:`${oldPurchasePrice} / ${oldPurchaseQty}`, newValue:`${purchasePrice} / ${purchaseQty}`,
    oldUnitPrice, newUnitPrice: ing.unitPrice
  }, prevCosts);
  showBanner(affected, ing.name);
  render();
}

function updateIngredientName(id, newName){
  const ing = ingredientById(id);
  if(!ing || !newName || ing.name === newName) return;
  const oldName = ing.name;
  ing.name = newName;
  persistData();
  applyChangeAndLog({ type:'ingredient_rename', targetId: ing.id, targetName: newName, field:'نام ماده اولیه', oldValue: oldName, newValue: newName }, allRecipeCosts());
  render();
}

function updateIngredientUnit(id, newUnit){
  const ing = ingredientById(id);
  if(!ing || ing.unit === newUnit) return;
  const oldUnit = ing.unit;
  ing.unit = newUnit;
  persistData();
  applyChangeAndLog({ type:'ingredient_unit', targetId: ing.id, targetName: ing.name, field:'واحد اندازه‌گیری', oldValue: UNIT_LABEL[oldUnit], newValue: UNIT_LABEL[newUnit] }, allRecipeCosts());
  render();
}

function createIngredient(name, purchasePrice, purchaseQty, unit){
  purchasePrice = Number(purchasePrice)||0; purchaseQty = Number(purchaseQty)||0;
  const ing = { id:uid('ing'), name, purchasePrice, purchaseQty, unitPrice:purchaseQty>0?purchasePrice/purchaseQty:0, unit:unit||'gram' };
  STATE.ingredients.push(ing);
  persistData();
  applyChangeAndLog({ type:'ingredient_add', targetId:ing.id, targetName:name, field:'ماده اولیه جدید', oldValue:'-', newValue:`${purchasePrice} / ${purchaseQty}` }, allRecipeCosts());
  return ing;
}

function deleteIngredient(id){
  const ing = ingredientById(id);
  if(!ing) return;
  const usedIn = recipesUsingIngredient(id);
  const prevCosts = allRecipeCosts();
  STATE.recipes.forEach(r => { r.items = r.items.filter(it => it.ingredientId !== id); });
  STATE.ingredients = STATE.ingredients.filter(i => i.id !== id);
  persistData();
  const affected = applyChangeAndLog({
    type:'ingredient_delete', targetId: id, targetName: ing.name,
    field:'حذف ماده اولیه', oldValue: ing.unitPrice, newValue: '-'
  }, prevCosts);
  showBanner(affected, ing.name + ' (حذف شد)');
  render();
}

// ---------- settings mutations ----------
function updateSetting(key, newVal, label){
  const oldVal = STATE.settings[key];
  if(oldVal === newVal) return;
  const prevCosts = allRecipeCosts();
  STATE.settings[key] = newVal;
  persistData();
  const affected = applyChangeAndLog({
    type:'setting', targetId: key, targetName: label,
    field: label, oldValue: oldVal, newValue: newVal
  }, prevCosts);
  showBanner(affected, label);
  render();
}

// ---------- recipe mutations ----------
function updateRecipeItemQty(recipeId, ingredientId, newQty){
  const r = recipeById(recipeId);
  const item = r.items.find(i=>i.ingredientId===ingredientId);
  if(!item || item.qty === newQty) return;
  const oldQty = item.qty;
  const prevCosts = allRecipeCosts();
  item.qty = newQty;
  item.needsReview = false;
  item.qtyRawText = null;
  persistData();
  const affected = applyChangeAndLog({
    type:'recipe_qty', targetId: r.id, targetName: r.name,
    field: `مقدار ${ingredientById(ingredientId)?.name || ''}`, oldValue: oldQty, newValue: newQty
  }, prevCosts);
  showBanner(affected, r.name);
  render();
}

function addIngredientToRecipe(recipeId, ingredientId, qty){
  const r = recipeById(recipeId);
  if(r.items.some(i=>i.ingredientId===ingredientId)) return;
  const prevCosts = allRecipeCosts();
  r.items.push({ ingredientId, qty, qtyRawText:null, isGarnish:false, needsReview:false });
  persistData();
  const affected = applyChangeAndLog({
    type:'recipe_item_add', targetId:r.id, targetName:r.name,
    field:`افزودن ${ingredientById(ingredientId)?.name||''}`, oldValue:'-', newValue:qty
  }, prevCosts);
  showBanner(affected, r.name);
  UI.editModal = { type:'recipe', id: recipeId };
  render();
}

function removeIngredientFromRecipe(recipeId, ingredientId){
  const r = recipeById(recipeId);
  const idx = r.items.findIndex(i=>i.ingredientId===ingredientId);
  if(idx<0) return;
  const removed = r.items[idx];
  const prevCosts = allRecipeCosts();
  r.items.splice(idx,1);
  persistData();
  const affected = applyChangeAndLog({
    type:'recipe_item_remove', targetId:r.id, targetName:r.name,
    field:`حذف ${ingredientById(ingredientId)?.name||''}`, oldValue:removed.qty, newValue:'-'
  }, prevCosts);
  showBanner(affected, r.name);
  render();
}

function updateRecipeMeta(recipeId, field, value){
  const r = recipeById(recipeId);
  if(!r || r[field] === value) return;
  const oldVal = r[field];
  r[field] = value;
  persistData();
  applyChangeAndLog({
    type:'recipe_meta', targetId:r.id, targetName:r.name,
    field: field==='name' ? 'نام محصول' : 'دسته', oldValue: oldVal, newValue: value
  }, allRecipeCosts());
  render();
}

function createRecipe(name, category){
  const r = { id: uid('rec'), name, category: category||'', items: [] };
  STATE.recipes.push(r);
  persistData();
  applyChangeAndLog({ type:'recipe_add', targetId:r.id, targetName:name, field:'محصول جدید', oldValue:'-', newValue:'-' }, allRecipeCosts());
  return r;
}

function deleteRecipe(recipeId){
  const r = recipeById(recipeId);
  if(!r) return;
  STATE.recipes = STATE.recipes.filter(x=>x.id!==recipeId);
  persistData();
  applyChangeAndLog({ type:'recipe_delete', targetId:recipeId, targetName:r.name, field:'حذف محصول', oldValue:'-', newValue:'-' }, {});
  UI.editModal = null;
  render();
}

function revertLogEntry(logId){
  const entry = STATE.log.find(l=>l.id===logId);
  if(!entry) return;
  if(entry.type === 'ingredient_rename'){
    updateIngredientName(entry.targetId, entry.oldValue);
  } else if(entry.type === 'ingredient_unit'){
    const key = Object.keys(UNIT_LABEL).find(k=>UNIT_LABEL[k]===entry.oldValue);
    if(key) updateIngredientUnit(entry.targetId, key);
  } else if(entry.type === 'setting'){
    updateSetting(entry.targetId, entry.oldValue, entry.targetName);
  } else if(entry.type === 'recipe_qty'){
    const r = recipeById(entry.targetId);
    if(r){
      const ingName = entry.field.replace('مقدار ','');
      const ing = STATE.ingredients.find(i=>i.name===ingName);
      if(ing) updateRecipeItemQty(r.id, ing.id, entry.oldValue);
    }
  } else {
    alert('این نوع تغییر قابل بازگردانی خودکار نیست.');
  }
}

<script>
function render(){
  const root = document.getElementById('root');
  if(!STATE.loaded){ root.innerHTML = `<div class="empty"><div class="big">⏳</div>در حال بارگذاری اطلاعات…</div>`; return; }
  root.innerHTML = `
    ${renderTopbar()}
    ${renderBanner()}
    ${renderTabs()}
    <div>${renderTabContent()}</div>
    ${UI.editModal ? renderModal() : ''}
  `;
  attachHandlers();
}

function reviewCount(){
  let n = 0;
  STATE.recipes.forEach(r => r.items.forEach(it => {
    if(!it.isGarnish){
      const ing = ingredientById(it.ingredientId);
      if(!ing || ing.unitPrice === 0 || it.needsReview) n++;
    }
  }));
  return n;
}

function renderTopbar(){
  return `
  <div class="topbar">
    <div class="brand">
      <h1>سامانه کنترل قیمت منو <span class="tag">SQLite</span></h1>
      <p>محاسبه خودکار قیمت تمام آیتم‌ها بر اساس قیمت مواد اولیه؛ با ثبت لاگ تغییرات و امکان بازگردانی. مبالغ بر حسب <b>هزار تومان</b>.</p>
    </div>
    <div class="actions">
      <button class="ghost" id="btn-reset">بازنشانی به داده اولیه</button>
      <button class="primary" id="btn-export">⬇ خروجی اکسل</button>
    </div>
  </div>`;
}

function renderBanner(){
  if(!UI.banner) return '';
  const b = UI.banner;
  if(b.type === 'info'){
    return `<div class="banner"><div>${b.text}</div><button class="close" id="banner-close">✕</button></div>`;
  }
  const rows = b.affected.map(a => `<li><b>${a.recipeName}</b>: قیمت نهایی از <span class="chip-price-old">${price(a.oldPrice)}</span> به <span class="chip-price-new">${price(a.newPrice)}</span> تغییر کرد</li>`).join('');
  return `<div class="banner warn">
    <div style="flex:1">
      <div>پس از تغییر «<b>${b.subject}</b>»، قیمت <b>${b.affected.length}</b> آیتم به‌روزرسانی شد:</div>
      <ul>${rows}</ul>
    </div>

}

function renderTabs(){
  const tabs = [
    {id:'products', label:'محصولات', count: STATE.recipes.length},
    {id:'ingredients', label:'مواد اولیه', count: STATE.ingredients.length},
    {id:'settings', label:'تنظیمات فرمول'},
    {id:'log', label:'لاگ تغییرات', count: STATE.log.length},
  ];
  return `<div class="tabs">${tabs.map(t => `
    <div class="tab ${UI.tab===t.id?'active':''}" data-tab="${t.id}">
      ${t.label}${t.count!==undefined ? `<span class="count">${fa(t.count)}</span>` : ''}
    </div>`).join('')}</div>`;
}

function renderTabContent(){
  if(UI.tab === 'products') return renderProducts();
  if(UI.tab === 'ingredients') return renderIngredients();
  if(UI.tab === 'settings') return renderSettings();
  if(UI.tab === 'log') return renderLog();
  return '';
}

// ================= PRODUCTS TAB =================
function renderProducts(){

  const categories = [...new Set(STATE.recipes.map(r=>r.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  return `
  <div class="card pad">
    <div class="toolbar">
      <div><div class="section-title">محصولات (${fa(STATE.recipes.length)})</div>
      <div class="section-sub">قیمت نهایی خودکار محاسبه می‌شود؛ می‌توانید محصولات را بر اساس دسته فیلتر کنید.</div></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="search-box" style="margin:0"><input type="text" id="product-search" placeholder="جست‌وجوی محصول…" value="${UI.productSearch}"></div>
        <select id="category-filter" class="category-filter"><option value="">همه دسته‌ها</option>${categories.map(c=>`<option value="${c}" ${UI.categoryFilter===c?'selected':''}>${c}</option>`).join('')}</select>

function renderProductsListOnly(){

  return `<div style="overflow-x:auto"><table><thead><tr><th>نام محصول</th><th>دسته</th><th>هزینه مواد</th><th>قیمت نهایی</th><th>وضعیت</th></tr></thead><tbody>
    ${list.map(r=>{ const c=computeRecipeCost(r); const needsReview=r.items.some(it=>!it.isGarnish&&(it.needsReview||(ingredientById(it.ingredientId)?.unitPrice||0)===0)); return `<tr class="clickable" data-open-recipe="${r.id}"><td><b>${r.name}</b></td><td style="color:var(--ink-soft)">${r.category||'—'}</td><td class="num">${price(c.material)}</td><td class="num"><b>${price(c.finalPrice)}</b></td><td>${needsReview?'<span class="pill bad">نیاز به بررسی</span>':'<span class="pill ok">کامل</span>'}</td></tr>`; }).join('') || `<tr><td colspan="5" class="empty">موردی یافت نشد</td></tr>`}

function renderAddIngredientModal(){

function renderLog(){
  if(STATE.log.length === 0){
    return `<div class="card pad"><div class="empty"><div class="big">📋</div>هنوز هیچ تغییری ثبت نشده است.</div></div>`;
  }
  return `<div class="card pad">
    <div class="section-title">لاگ تغییرات قیمت (${fa(STATE.log.length)})</div>
    <div class="section-sub">هر تغییر قیمت، نام، واحد، مقدار مصرفی یا فرمول، همراه با مقدار قبل و بعد، در این‌جا ثبت می‌شود تا در صورت نیاز بتوانید آن را بازگردانی کنید.</div>

    ${STATE.log.map(l => `
      <div class="log-item">
        <div class="log-head">
          <div>
            <b>${l.targetName}</b> — ${l.field} از
            <span class="chip-price-old">${typeof l.oldValue==='number'?fa(l.oldValue):l.oldValue}</span>
            <span class="arrow">←</span>
            <span class="chip-price-new">${typeof l.newValue==='number'?fa(l.newValue):l.newValue}</span>
            تغییر کرد
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="log-meta">${l.tsLabel}</span>
            ${['ingredient_rename','ingredient_unit','setting','recipe_qty'].includes(l.type) ? `<button class="ghost" data-revert="${l.id}" style="font-size:12px;padding:5px 10px">بازگردانی</button>`:''}
          </div>
        </div>
        ${l.affected && l.affected.length>0 ? `
        <div class="log-affected">
          ${l.affected.length} محصول تحت تاثیر: ${l.affected.map(a=>`<b>${a.recipeName}</b> (<span class="chip-price-old">${price(a.oldPrice)}</span> ← <span class="chip-price-new">${price(a.newPrice)}</span>)`).join('، ')}
        </div>`:''}
      </div>
    `).join('')}

function renderModal(){
  const m = UI.editModal;
  let inner = '';
  if(m.type === 'recipe') inner = renderRecipeModal(m.id);
  if(m.type === 'add-item') inner = renderAddItemModal(m.id);
  if(m.type === 'add-recipe') inner = renderAddRecipeModal();
  if(m.type === 'add-ingredient') inner = renderAddIngredientModal();
  if(m.type === 'usage') inner = renderUsageModal(m.id);
  return `<div class="modal-bg" id="modal-bg"><div class="modal">${inner}</div></div>`;
}
</script>
<script>
function attachHandlers(){
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ UI.tab = el.dataset.tab; UI.banner=null; render(); };
  });

  const bc = document.getElementById('banner-close');
  if(bc) bc.onclick = ()=>{ UI.banner=null; render(); };

  const resetBtn = document.getElementById('btn-reset');
  if(resetBtn) resetBtn.onclick = async ()=>{
    if(!confirm('همه داده‌ها (مواد اولیه، محصولات، تنظیمات) به حالت اولیه بازمی‌گردد و لاگ تغییرات پاک می‌شود. ادامه می‌دهید؟')) return;
    STATE.ingredients = JSON.parse(JSON.stringify(SEED_DATA.ingredients));
    STATE.recipes = JSON.parse(JSON.stringify(SEED_DATA.recipes));
    STATE.settings = JSON.parse(JSON.stringify(SEED_DATA.settings));
    STATE.log = [];
    await persistData();
    await persistLog();
    UI.banner = null;
    render();
  };

  const exportBtn = document.getElementById('btn-export');
  if(exportBtn) exportBtn.onclick = exportExcel;

  // ---------- products tab ----------
  wireSearchInput('product-search', 'products-list-wrapper', v=>{ UI.productSearch = v; }, renderProductsListOnly, ()=>attachProductsListHandlers());
  attachProductsListHandlers();
  const catFilter=document.getElementById('category-filter');
  if(catFilter) catFilter.onchange=()=>{ UI.categoryFilter=catFilter.value; const w=document.getElementById('products-list-wrapper'); if(w){w.innerHTML=renderProductsListOnly(); attachProductsListHandlers();} };

  const addRecipeBtn = document.getElementById('btn-add-recipe');
  if(addRecipeBtn) addRecipeBtn.onclick = ()=>{ UI.editModal = {type:'add-recipe'}; render(); };

  // ---------- ingredients tab ----------
  wireSearchInput('ing-search', 'ingredients-list-wrapper', v=>{ UI.ingredientSearch = v; }, renderIngredientsListOnly, ()=>attachIngredientsListHandlers());
  attachIngredientsListHandlers();

  const addIngBtn = document.getElementById('btn-add-ingredient');
  if(addIngBtn) addIngBtn.onclick = ()=>{ UI.editModal = {type:'add-ingredient'}; render(); };

  // ---------- settings tab ----------
  const applyBtn = document.getElementById('btn-apply-settings');
  if(applyBtn) applyBtn.onclick = ()=>{
    const waste = parseFloat(document.getElementById('set-waste').value)/100;
    const margin = parseFloat(document.getElementById('set-margin').value)/100;
    const overhead = parseFloat(document.getElementById('set-overhead').value);
    const packaging = parseFloat(document.getElementById('set-packaging').value);
    const other = parseFloat(document.getElementById('set-other').value);
    if(waste !== STATE.settings.wasteRate) updateSetting('wasteRate', waste, 'نرخ ضایعات');
    if(margin !== STATE.settings.marginRate) updateSetting('marginRate', margin, 'حاشیه سود');
    if(overhead !== STATE.settings.overheadCost) updateSetting('overheadCost', overhead, 'هزینه سربار');
    if(packaging !== STATE.settings.packagingCost) updateSetting('packagingCost', packaging, 'هزینه بسته‌بندی');
    if(other !== STATE.settings.otherCost) updateSetting('otherCost', other, 'سایر هزینه‌ها');
  };

  // ---------- log tab ----------
  document.querySelectorAll('[data-revert]').forEach(el=>{
    el.onclick = ()=>{ if(confirm('این تغییر بازگردانی شود؟')) revertLogEntry(el.dataset.revert); };
  });

  // ---------- modal ----------
  const bg = document.getElementById('modal-bg');
  if(bg){ bg.onclick = (e)=>{ if(e.target.id === 'modal-bg'){ UI.editModal=null; render(); } }; }
  ['modal-close','modal-close2'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.onclick = ()=>{ UI.editModal=null; render(); };
  });

  // recipe modal specific
  document.querySelectorAll('.qty-input').forEach(el=>{
    el.onchange = ()=>{ const v = parseFloat(el.value)||0; updateRecipeItemQty(el.dataset.recipe, el.dataset.ing, v); };
  });
  document.querySelectorAll('[data-remove-item]').forEach(el=>{
    el.onclick = ()=>{ if(confirm('این ماده اولیه از ترکیب حذف شود؟')) removeIngredientFromRecipe(el.dataset.recipe, el.dataset.removeItem); };
  });
  const addItemBtn = document.getElementById('btn-add-item');
  if(addItemBtn) addItemBtn.onclick = ()=>{ UI.editModal = {type:'add-item', id: addItemBtn.dataset.recipe}; render(); };
  const ingSearch=document.getElementById('new-item-ing-search');
  if(ingSearch){ ingSearch.oninput=()=>{ const q=ingSearch.value.trim(); const sel=document.getElementById('new-item-ing'); const r=recipeById(UI.editModal.id); const used=new Set(r.items.map(i=>i.ingredientId)); const arr=STATE.ingredients.filter(i=>!used.has(i.id)&&(!q||i.name.includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'fa')); sel.innerHTML=arr.map(i=>`<option value="${i.id}">${i.name} ${i.unitPrice?'('+fa(i.unitPrice)+' هزار ت/'+UNIT_LABEL[i.unit]+')':'(بدون قیمت)'}</option>`).join(''); }; }
  const confirmAdd = document.getElementById('btn-confirm-add-item');
  if(confirmAdd) confirmAdd.onclick = ()=>{
    const recipeId = confirmAdd.dataset.recipe;
    const newName = document.getElementById('new-ing-name').value.trim();
    const newPurchasePrice = parseFloat(document.getElementById('new-ing-purchase-price').value) || 0;
    const newPurchaseQty = parseFloat(document.getElementById('new-ing-purchase-qty').value) || 0;
    const newUnit = document.getElementById('new-ing-unit').value;
    const qty = parseFloat(document.getElementById('new-item-qty').value) || 0;
    let ingId;
    if(newName){
      const created = createIngredient(newName, newPurchasePrice, newPurchaseQty, newUnit);
      ingId = created.id;
    } else {
      ingId = document.getElementById('new-item-ing').value;
    }
    if(!ingId){ alert('ماده اولیه را انتخاب کنید یا نام جدید وارد کنید.'); return; }
    addIngredientToRecipe(recipeId, ingId, qty);
  };
  const editRecipeName = document.getElementById('edit-recipe-name');
  if(editRecipeName) editRecipeName.onchange = ()=>{ updateRecipeMeta(editRecipeName.dataset.recipe, 'name', editRecipeName.value.trim()); };
  const editRecipeCategory = document.getElementById('edit-recipe-category');
  if(editRecipeCategory) editRecipeCategory.onchange = ()=>{ updateRecipeMeta(editRecipeCategory.dataset.recipe, 'category', editRecipeCategory.value.trim()); };
  const deleteRecipeBtn = document.getElementById('btn-delete-recipe');
  if(deleteRecipeBtn) deleteRecipeBtn.onclick = ()=>{
    if(confirm('این محصول برای همیشه حذف شود؟')){
      deleteRecipe(deleteRecipeBtn.dataset.recipe);
    }
  };

  // add-recipe modal
  const confirmAddRecipe = document.getElementById('btn-confirm-add-recipe');
  if(confirmAddRecipe) confirmAddRecipe.onclick = ()=>{
    const name = document.getElementById('new-recipe-name').value.trim();
    if(!name){ alert('نام محصول را وارد کنید.'); return; }
    const category = document.getElementById('new-recipe-category').value.trim();
    const r = createRecipe(name, category);
    UI.editModal = { type:'recipe', id: r.id };
    render();
  };

  // add-ingredient modal
  const confirmAddIng = document.getElementById('btn-confirm-add-ingredient');
  if(confirmAddIng) confirmAddIng.onclick = ()=>{
    const name = document.getElementById('add-ing-name').value.trim();
    if(!name){ alert('نام ماده اولیه را وارد کنید.'); return; }
    const purchasePrice = parseFloat(document.getElementById('add-ing-purchase-price').value) || 0;
    const purchaseQty = parseFloat(document.getElementById('add-ing-purchase-qty').value) || 0;
    const unit = document.getElementById('add-ing-unit').value;
    createIngredient(name, purchasePrice, purchaseQty, unit);
    UI.editModal = null;
    render();
  };

  // usage modal — nothing extra to wire
}

function attachProductsListHandlers(){
  document.querySelectorAll('[data-open-recipe]').forEach(el=>{
    el.onclick = ()=>{ UI.editModal = {type:'recipe', id: el.dataset.openRecipe}; render(); };
  });
}

function attachIngredientsListHandlers(){
  document.querySelectorAll('.purchase-price-input,.purchase-qty-input').forEach(el=>{
    el.onchange=()=>{ const id=el.dataset.ing; const p=document.querySelector(`.purchase-price-input[data-ing="${id}"]`); const q=document.querySelector(`.purchase-qty-input[data-ing="${id}"]`); updateIngredientPurchase(id, parseFloat(p.value)||0, parseFloat(q.value)||0); };
  });
  document.querySelectorAll('.name-input').forEach(el=>{
    el.onchange = ()=>{ const v = el.value.trim(); if(v) updateIngredientName(el.dataset.ing, v); else el.value = ingredientById(el.dataset.ing).name; };
  });
  document.querySelectorAll('.unit-select-ing').forEach(el=>{
    el.onchange = ()=>{ updateIngredientUnit(el.dataset.ing, el.value); };
  });
  document.querySelectorAll('[data-view-usage]').forEach(el=>{
    el.onclick = ()=>{ UI.editModal = {type:'usage', id: el.dataset.viewUsage}; render(); };
  });
  document.querySelectorAll('[data-delete-ing]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.deleteIng;
      const ing = ingredientById(id);
      const usedIn = recipesUsingIngredient(id);
      const msg = usedIn.length>0
        ? `«${ing.name}» در ${usedIn.length} محصول استفاده شده. با حذف آن، از ترکیب همه آن محصولات هم حذف می‌شود. ادامه می‌دهید؟`
        : `ماده اولیه «${ing.name}» حذف شود؟`;
      if(confirm(msg)) deleteIngredient(id);
    };
  });
}

// Generic helper: wires a search input so that typing only re-renders
// a scoped wrapper element (not the whole page), preserving focus & caret.
function wireSearchInput(inputId, wrapperId, setStateFn, renderListFn, reattachFn){
  const input = document.getElementById(inputId);
  if(!input) return;
  input.oninput = (e)=>{
    setStateFn(e.target.value);
    const wrapper = document.getElementById(wrapperId);
    const caret = e.target.selectionStart;
    wrapper.innerHTML = renderListFn();
    reattachFn();
    // input node itself was untouched, just restore caret in case browser normalized it
    e.target.focus();
    e.target.setSelectionRange(caret, caret);
  };
}

// ---------- EXPORT TO EXCEL ----------
function exportExcel(){
  const wb = XLSX.utils.book_new();

  const ingRows = [['نام ماده اولیه','واحد','مبلغ خرید (هزار تومان)','مقدار خرید','قیمت هر واحد (هزار تومان)','تعداد محصولات مصرف‌کننده']];
  STATE.ingredients.slice().sort((a,b)=>a.name.localeCompare(b.name,'fa')).forEach(i=>{
    ingRows.push([i.name, UNIT_LABEL[i.unit], i.purchasePrice||0, i.purchaseQty||0, i.unitPrice, recipesUsingIngredient(i.id).length]);
  });
  const ws1 = XLSX.utils.aoa_to_sheet(ingRows);
  ws1['!cols'] = [{wch:28},{wch:10},{wch:20},{wch:15},{wch:22},{wch:22}];
  XLSX.utils.book_append_sheet(wb, ws1, 'مواد اولیه');

  const recRows = [['نام محصول','دسته','هزینه مواد (هزار تومان)','قیمت نهایی (هزار تومان)','وضعیت']];
  STATE.recipes.forEach(r=>{
    const c = computeRecipeCost(r);
    const needsReview = r.items.some(it=>!it.isGarnish && (it.needsReview || (ingredientById(it.ingredientId)?.unitPrice||0)===0));
    recRows.push([r.name, r.category||'', Math.round(c.material), Math.round(c.finalPrice), needsReview?'نیاز به بررسی':'کامل']);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(recRows);
  ws2['!cols'] = [{wch:26},{wch:18},{wch:20},{wch:20},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, 'محصولات');

  const detRows = [['نام محصول','ماده اولیه','مقدار مصرفی','واحد','قیمت واحد (هزار تومان)','هزینه این قلم (هزار تومان)','تزئین؟']];
  STATE.recipes.forEach(r=>{
    r.items.forEach(it=>{
      const ing = ingredientById(it.ingredientId);
      detRows.push([r.name, ing?ing.name:'?', it.qty, ing?UNIT_LABEL[ing.unit]:'', ing?ing.unitPrice:0, (it.qty||0)*(ing?ing.unitPrice:0), it.isGarnish?'بله':'خیر']);
    });
  });
  const ws3 = XLSX.utils.aoa_to_sheet(detRows);
  ws3['!cols'] = [{wch:24},{wch:22},{wch:12},{wch:8},{wch:18},{wch:20},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws3, 'جزئیات ترکیب');

  const s = STATE.settings;
  const setRows = [
    ['پارامتر','مقدار'],
    ['نرخ ضایعات (٪)', s.wasteRate*100],
    ['حاشیه سود (٪)', s.marginRate*100],
    ['هزینه سربار (هزار تومان)', s.overheadCost],
    ['هزینه بسته‌بندی (هزار تومان)', s.packagingCost],
    ['سایر هزینه‌ها (هزار تومان)', s.otherCost],
  ];
  const ws4 = XLSX.utils.aoa_to_sheet(setRows);
  ws4['!cols'] = [{wch:26},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws4, 'تنظیمات فرمول');

  const logRows = [['تاریخ','نوع تغییر','هدف','فیلد','مقدار قبلی','مقدار جدید','تعداد محصول متاثر']];
  STATE.log.forEach(l=>{
    logRows.push([l.tsLabel, l.type, l.targetName, l.field, l.oldValue, l.newValue, (l.affected||[]).length]);
  });
  const ws5 = XLSX.utils.aoa_to_sheet(logRows);
  ws5['!cols'] = [{wch:20},{wch:16},{wch:22},{wch:22},{wch:14},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, ws5, 'لاگ تغییرات');

  const dateTag = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `قیمت‌گذاری-منو-${dateTag}.xlsx`);
}
